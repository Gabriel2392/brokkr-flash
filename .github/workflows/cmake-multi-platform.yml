name: Build & Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Publish the current version. 'stable' then bumps the patch for development; 'beta' does not change it."
        required: true
        type: choice
        options:
          - none
          - stable
          - beta
        default: none
      prerelease_label:
        description: "Pre-release label, used only when release_type is 'beta' (e.g. beta1, beta2, rc1)."
        required: false
        type: string
        default: "beta1"

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"

jobs:
  # ═══════════════════════════════════════════════════
  #  Resolve and tag release
  # ═══════════════════════════════════════════════════
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      full_version: ${{ steps.ver.outputs.full_version }}
      label: ${{ steps.ver.outputs.label }}
      tag: ${{ steps.ver.outputs.tag }}
      prev_tag: ${{ steps.ver.outputs.prev_tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        env:
          RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'none' }}
          PRERELEASE_LABEL: ${{ inputs.prerelease_label }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          matches="$(grep -cE '^project\(Brokkr LANGUAGES C CXX VERSION [0-9]+\.[0-9]+\.[0-9]+\)' CMakeLists.txt || true)"
          if [ "$matches" != "1" ]; then
            echo "::error::Expected exactly one numeric project(Brokkr ... VERSION x.y.z) line in CMakeLists.txt (found ${matches})."
            exit 1
          fi
          CURRENT="$(sed -nE 's/^project\(Brokkr LANGUAGES C CXX VERSION ([0-9]+\.[0-9]+\.[0-9]+)\).*/\1/p' CMakeLists.txt)"

          if [ "$RELEASE_TYPE" = "none" ]; then
            {
              echo "version=${CURRENT}"
              echo "full_version=${CURRENT}-dev"
              echo "label=dev"
              echo "tag="
              echo "prev_tag="
              echo "next_version="
              echo "prerelease=false"
            } >> "$GITHUB_OUTPUT"
            echo "Development build ${CURRENT}-dev"
            exit 0
          fi

          VERSION="$CURRENT"
          PREV_TAG=""
          while IFS= read -r OLD_TAG; do
            if git rev-parse -q --verify "refs/tags/${OLD_TAG}^{commit}" > /dev/null &&
              git merge-base --is-ancestor "refs/tags/${OLD_TAG}^{commit}" HEAD; then
              PREV_TAG="$OLD_TAG"
              break
            fi
          done < <(
            gh api --paginate "repos/${REPO}/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name' 2>/dev/null || true
          )
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"
          fi
          NEXT_VERSION=""

          if [ "$RELEASE_TYPE" = "beta" ]; then
            LABEL="$PRERELEASE_LABEL"
            if ! printf '%s' "$LABEL" | grep -qE '^[0-9A-Za-z][0-9A-Za-z.]*$'; then
              echo "::error::prerelease_label must start with a letter or digit and contain only letters, digits and dots (got '${LABEL}')."
              exit 1
            fi
            case "$LABEL" in
              dbg | dev | rel)
                echo "::error::'${LABEL}' is reserved; pick a different pre-release label."
                exit 1
                ;;
            esac
            FULL_VERSION="${VERSION}-${LABEL}"
            PRERELEASE=true
          else
            LABEL="rel"
            FULL_VERSION="${VERSION}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEXT_VERSION="${MAJOR}.${MINOR}.$((10#$PATCH + 1))"
            PRERELEASE=false
          fi

          TAG="v${FULL_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "::error::Tag ${TAG} already exists."
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "full_version=${FULL_VERSION}"
            echo "label=${LABEL}"
            echo "tag=${TAG}"
            echo "prev_tag=${PREV_TAG}"
            echo "next_version=${NEXT_VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

          echo "Tagging ${TAG} (next=${NEXT_VERSION:-unchanged})"

      - name: Tag release
        if: github.event_name == 'workflow_dispatch' && inputs.release_type != 'none'
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          NEXT_VERSION: ${{ steps.ver.outputs.next_version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"

          if [ "$RELEASE_TYPE" = "beta" ]; then
            git push origin "refs/tags/${TAG}"
          else
            test -n "$NEXT_VERSION"
            sed -i -E "s/^(project\(Brokkr LANGUAGES C CXX VERSION )[0-9]+\.[0-9]+\.[0-9]+(\))/\1${NEXT_VERSION}\2/" CMakeLists.txt
            grep -qF "project(Brokkr LANGUAGES C CXX VERSION ${NEXT_VERSION})" CMakeLists.txt
            git add CMakeLists.txt
            git commit -m "Bump version to ${NEXT_VERSION}"
            git push --atomic origin HEAD:main "refs/tags/${TAG}"
          fi

  # ═══════════════════════════════════════════════════
  #  Linux – Ubuntu 24.04, AppImage (x64)
  # ═══════════════════════════════════════════════════
  linux_appimage:
    name: Linux AppImage x64 (${{ matrix.build_type }})
    needs: [prepare]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - build_type: Release
            suffix: ""
          - build_type: Debug
            suffix: "-dbg"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Install build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14 g++-14 ninja-build cmake patchelf \
            libgl1-mesa-dev libfuse2 imagemagick wget file

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: install-qt-action-${{ github.job }}-${{ env.QT_VERSION }}-${{ matrix.build_type }}
          arch: linux_gcc_64

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DBROKKR_VERSION_SUFFIX="${{ needs.prepare.outputs.label }}" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Capture screenshot
        if: matrix.build_type == 'Release'
        run: |
          set -euo pipefail
          QT_QPA_PLATFORM=offscreen BROKKR_SCREENSHOT="$PWD/screenshot-linux.png" timeout 60 ./build/brokkr
          test -f screenshot-linux.png

      - uses: actions/upload-artifact@v7
        if: matrix.build_type == 'Release'
        with:
          name: screenshot-linux
          path: screenshot-linux.png

      - name: Stage AppDir
        run: |
          set -euo pipefail
          rm -rf AppDir
          cmake --install build --prefix "$PWD/AppDir/usr"

          mkdir -p AppDir/usr/lib
          cp "$(g++-14 -print-file-name=libstdc++.so.6)" AppDir/usr/lib/ || true
          cp "$(gcc-14 -print-file-name=libgcc_s.so.1)"  AppDir/usr/lib/ || true

      - name: Desktop file + icon
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps

          cat > AppDir/usr/share/applications/brokkr.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Brokkr
          Exec=brokkr
          Icon=brokkr
          Categories=Utility;
          Terminal=false
          DESKTOP
          sed -i 's/^[[:space:]]*//' AppDir/usr/share/applications/brokkr.desktop

          convert assets/brokkr.ico /tmp/brokkr_frame.png
          biggest="$(ls -rS /tmp/brokkr_frame*.png | tail -n1)"
          convert "$biggest" -resize 256x256! \
            AppDir/usr/share/icons/hicolor/256x256/apps/brokkr.png
          identify AppDir/usr/share/icons/hicolor/256x256/apps/brokkr.png

      - name: Build AppImage
        run: |
          set -euo pipefail
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          export PATH="$QT_ROOT_DIR/bin:$PATH"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e AppDir/usr/bin/brokkr \
            -d AppDir/usr/share/applications/brokkr.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/brokkr.png \
            --plugin qt \
            --output appimage

          mv Brokkr-x86_64.AppImage Brokkr-${{ needs.prepare.outputs.full_version }}-linux-x86_64${{ matrix.suffix }}.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: Brokkr-${{ needs.prepare.outputs.full_version }}-linux-x86_64${{ matrix.suffix }}.AppImage
          path: Brokkr-${{ needs.prepare.outputs.full_version }}-linux-x86_64${{ matrix.suffix }}.AppImage

  # ═══════════════════════════════════════════════════
  #  Linux – Ubuntu 24.04, AppImage (arm64)
  # ═══════════════════════════════════════════════════
  linux_appimage_arm64:
    name: Linux AppImage arm64 (${{ matrix.build_type }})
    needs: [prepare]
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - build_type: Release
            suffix: ""
          - build_type: Debug
            suffix: "-dbg"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Install build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14 g++-14 ninja-build cmake patchelf \
            libgl1-mesa-dev libfuse2 imagemagick wget file

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: install-qt-action-${{ github.job }}-${{ env.QT_VERSION }}-${{ matrix.build_type }}
          arch: linux_gcc_arm64

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DBROKKR_VERSION_SUFFIX="${{ needs.prepare.outputs.label }}" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Stage AppDir
        run: |
          set -euo pipefail
          rm -rf AppDir
          cmake --install build --prefix "$PWD/AppDir/usr"

          mkdir -p AppDir/usr/lib
          cp "$(g++-14 -print-file-name=libstdc++.so.6)" AppDir/usr/lib/ || true
          cp "$(gcc-14 -print-file-name=libgcc_s.so.1)"  AppDir/usr/lib/ || true

      - name: Desktop file + icon
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps

          cat > AppDir/usr/share/applications/brokkr.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Brokkr
          Exec=brokkr
          Icon=brokkr
          Categories=Utility;
          Terminal=false
          DESKTOP
          sed -i 's/^[[:space:]]*//' AppDir/usr/share/applications/brokkr.desktop

          convert assets/brokkr.ico /tmp/brokkr_frame.png
          biggest="$(ls -rS /tmp/brokkr_frame*.png | tail -n1)"
          convert "$biggest" -resize 256x256! \
            AppDir/usr/share/icons/hicolor/256x256/apps/brokkr.png
          identify AppDir/usr/share/icons/hicolor/256x256/apps/brokkr.png

      - name: Build AppImage
        run: |
          set -euo pipefail
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage"
          chmod +x linuxdeploy-aarch64.AppImage linuxdeploy-plugin-qt-aarch64.AppImage

          export PATH="$QT_ROOT_DIR/bin:$PATH"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"

          ./linuxdeploy-aarch64.AppImage \
            --appdir AppDir \
            -e AppDir/usr/bin/brokkr \
            -d AppDir/usr/share/applications/brokkr.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/brokkr.png \
            --plugin qt \
            --output appimage

          mv Brokkr-aarch64.AppImage Brokkr-${{ needs.prepare.outputs.full_version }}-linux-arm64${{ matrix.suffix }}.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: Brokkr-${{ needs.prepare.outputs.full_version }}-linux-arm64${{ matrix.suffix }}.AppImage
          path: Brokkr-${{ needs.prepare.outputs.full_version }}-linux-arm64${{ matrix.suffix }}.AppImage

  # ═══════════════════════════════════════════════════
  #  Windows x64 + arm64 (NSIS installer + portable zip)
  # ═══════════════════════════════════════════════════
  windows_installer:
    name: Windows installer ${{ matrix.artifact_arch }} (${{ matrix.build_type }})
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-2022
            artifact_arch: x64
            msvc_arch: x64
            qt_host: windows
            qt_arch: win64_msvc2022_64
            build_type: Release
            suffix: ""
          - runner: windows-2022
            artifact_arch: x64
            msvc_arch: x64
            qt_host: windows
            qt_arch: win64_msvc2022_64
            build_type: Debug
            suffix: "-dbg"
          - runner: windows-11-arm
            artifact_arch: arm64
            msvc_arch: arm64
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            build_type: Release
            suffix: ""
          - runner: windows-11-arm
            artifact_arch: arm64
            msvc_arch: arm64
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            build_type: Debug
            suffix: "-dbg"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install NSIS + Ninja
        shell: powershell
        run: choco install nsis ninja -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: install-qt-action-${{ github.job }}-${{ matrix.artifact_arch }}-${{ env.QT_VERSION }}-${{ matrix.build_type }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBROKKR_VERSION_SUFFIX="${{ needs.prepare.outputs.label }}" \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Capture screenshot
        if: matrix.build_type == 'Release' && matrix.artifact_arch == 'x64'
        shell: powershell
        run: |
          $env:BROKKR_SCREENSHOT = "$PWD\screenshot-windows.png"
          $p = Start-Process -FilePath "build\brokkr.exe" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); exit 1 }
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (!(Test-Path screenshot-windows.png)) { exit 1 }

      - uses: actions/upload-artifact@v7
        if: matrix.build_type == 'Release' && matrix.artifact_arch == 'x64'
        with:
          name: screenshot-windows
          path: screenshot-windows.png

      - name: Package (NSIS installer)
        shell: bash
        run: |
          set -euo pipefail
          cd build
          cpack -G NSIS -C ${{ matrix.build_type }} || {
            echo "::error::NSIS packaging failed – dumping log:"
            cat _CPack_Packages/*/NSIS/NSISOutput.log 2>/dev/null || true
            exit 1
          }
          installer="$(ls -1 *.exe | head -n1)"
          mv "$installer" ../Brokkr-${{ needs.prepare.outputs.full_version }}-windows-${{ matrix.artifact_arch }}${{ matrix.suffix }}.exe

      - name: Package (portable zip)
        shell: bash
        run: |
          set -euo pipefail
          install_root="$PWD/portable/brokkr"
          rm -rf "$install_root"
          cmake --install build --prefix "$install_root" --config ${{ matrix.build_type }}
          cd portable
          7z a -tzip ../Brokkr-${{ needs.prepare.outputs.full_version }}-windows-${{ matrix.artifact_arch }}${{ matrix.suffix }}.zip brokkr/

      - name: Verify deployed binary architectures
        shell: bash
        run: |
          set -euo pipefail
          python - ${{ matrix.artifact_arch }} <<'EOF'
          import struct, sys
          from pathlib import Path

          expected = {"x64": 0x8664, "arm64": 0xAA64}[sys.argv[1]]
          bad = []
          for p in sorted(Path("portable/brokkr").rglob("*")):
              # vc_redist bootstrappers are legitimately x86 stubs
              if p.suffix.lower() not in (".exe", ".dll") or p.name.startswith("vc_redist"):
                  continue
              data = p.read_bytes()
              pe_off = struct.unpack_from("<I", data, 0x3C)[0]
              machine = struct.unpack_from("<H", data, pe_off + 4)[0]
              ok = machine == expected
              print(f"{'ok ' if ok else 'BAD'} {machine:#06x} {p}")
              if not ok:
                  bad.append(str(p))
          if bad:
              sys.exit(f"{len(bad)} binaries do not match {sys.argv[1]} ({expected:#06x}): {', '.join(bad)}")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: Brokkr-${{ needs.prepare.outputs.full_version }}-windows-${{ matrix.artifact_arch }}${{ matrix.suffix }}.exe
          path: Brokkr-${{ needs.prepare.outputs.full_version }}-windows-${{ matrix.artifact_arch }}${{ matrix.suffix }}.exe

      - uses: actions/upload-artifact@v7
        with:
          name: Brokkr-${{ needs.prepare.outputs.full_version }}-windows-${{ matrix.artifact_arch }}${{ matrix.suffix }}.zip
          path: Brokkr-${{ needs.prepare.outputs.full_version }}-windows-${{ matrix.artifact_arch }}${{ matrix.suffix }}.zip

  # ═══════════════════════════════════════════════════
  #  macOS arm64
  # ═══════════════════════════════════════════════════
  macos_app:
    name: macOS app arm64 (${{ matrix.build_type }})
    needs: [prepare]
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - build_type: Release
            suffix: ""
          - build_type: Debug
            suffix: "-dbg"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Ninja
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: install-qt-action-${{ github.job }}-${{ env.QT_VERSION }}-${{ matrix.build_type }}
          arch: clang_64

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBROKKR_VERSION_SUFFIX="${{ needs.prepare.outputs.label }}" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Strip missing AGL framework from build files
        run: |
          set -euo pipefail
          sed -i '' 's/ -framework AGL//g; s/-framework AGL //g; s/-framework AGL//g' build/build.ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Capture screenshot
        if: matrix.build_type == 'Release'
        run: |
          set -euo pipefail
          BROKKR_SCREENSHOT="$PWD/screenshot-macos.png" ./build/brokkr.app/Contents/MacOS/brokkr
          test -f screenshot-macos.png

      - uses: actions/upload-artifact@v7
        if: matrix.build_type == 'Release'
        with:
          name: screenshot-macos
          path: screenshot-macos.png

      - name: Deploy + Zip
        if: matrix.build_type == 'Release'
        run: |
          set -euo pipefail
          APP="build/brokkr.app"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -verbose=2
          ditto -c -k --sequesterRsrc --keepParent "$APP" Brokkr-${{ needs.prepare.outputs.full_version }}-macos-arm64${{ matrix.suffix }}.app.zip

      - name: Deploy + Zip (debug)
        if: matrix.build_type == 'Debug'
        run: |
          set -euo pipefail
          APP="build/brokkr.app"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -verbose=2
          xattr -cr "$APP" || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" Brokkr-${{ needs.prepare.outputs.full_version }}-macos-arm64${{ matrix.suffix }}.app.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Brokkr-${{ needs.prepare.outputs.full_version }}-macos-arm64${{ matrix.suffix }}.app.zip
          path: Brokkr-${{ needs.prepare.outputs.full_version }}-macos-arm64${{ matrix.suffix }}.app.zip

  # ═══════════════════════════════════════════════════
  #  macOS x86_64 (Big Sur+)
  # ═══════════════════════════════════════════════════
  macos_app_x86:
    name: macOS app x86_64 (${{ matrix.build_type }})
    needs: [prepare]
    runs-on: macos-15-intel
    strategy:
      matrix:
        include:
          - build_type: Release
            suffix: ""
          - build_type: Debug
            suffix: "-dbg"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Ninja
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: install-qt-action-${{ github.job }}-${{ env.QT_VERSION }}-${{ matrix.build_type }}
          arch: clang_64

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBROKKR_VERSION_SUFFIX="${{ needs.prepare.outputs.label }}" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Strip missing AGL framework from build files
        run: |
          set -euo pipefail
          sed -i '' 's/ -framework AGL//g; s/-framework AGL //g; s/-framework AGL//g' build/build.ninja

      - name: Build
        run: cmake --build build --parallel
        
      - name: Deploy + Zip
        if: matrix.build_type == 'Release'
        run: |
          set -euo pipefail
          APP="build/brokkr.app"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -verbose=2
          ditto -c -k --sequesterRsrc --keepParent "$APP" Brokkr-${{ needs.prepare.outputs.full_version }}-macos-x86_64${{ matrix.suffix }}.app.zip

      - name: Deploy + Zip (debug)
        if: matrix.build_type == 'Debug'
        run: |
          set -euo pipefail
          APP="build/brokkr.app"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -verbose=2
          xattr -cr "$APP" || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" Brokkr-${{ needs.prepare.outputs.full_version }}-macos-x86_64${{ matrix.suffix }}.app.zip


      - uses: actions/upload-artifact@v7
        with:
          name: Brokkr-${{ needs.prepare.outputs.full_version }}-macos-x86_64${{ matrix.suffix }}.app.zip
          path: Brokkr-${{ needs.prepare.outputs.full_version }}-macos-x86_64${{ matrix.suffix }}.app.zip

  android_apk:
    name: Android APK
    needs: [prepare]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Resolve source commit
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check app repository credentials
        id: cfg
        env:
          ANDROID_REPO: ${{ secrets.ANDROID_REPO }}
          ANDROID_TOKEN: ${{ secrets.ANDROID_DISPATCH_TOKEN }}
          NEW_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_REPO" ] && [ -n "$ANDROID_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if [ -n "$NEW_TAG" ]; then
            echo "::error::ANDROID_REPO and ANDROID_DISPATCH_TOKEN secrets are required to publish a release."
            exit 1
          fi
          echo "::warning::Android secrets are not configured; skipping the APK build."

      - name: Build APK in the app repository
        if: steps.cfg.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.ANDROID_DISPATCH_TOKEN }}
          ANDROID_REPO: ${{ secrets.ANDROID_REPO }}
          NEW_TAG: ${{ needs.prepare.outputs.tag }}
          FULL_VERSION: ${{ needs.prepare.outputs.full_version }}
          SYNC_VERSION: ${{ needs.prepare.outputs.label == 'rel' }}
          BROKKR_SHA: ${{ steps.src.outputs.sha }}
        run: |
          set -euo pipefail

          DISPATCH_ID="brokkr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DEFAULT_BRANCH="$(gh api "repos/${ANDROID_REPO}" --jq '.default_branch')"

          gh workflow run build-apk.yml \
            -R "${ANDROID_REPO}" \
            --ref "${DEFAULT_BRANCH}" \
            -f version="${FULL_VERSION}" \
            -f brokkr_ref="${BROKKR_SHA}" \
            -f sync_submodule=true \
            -f sync_version="${SYNC_VERSION}" \
            -f dispatch_id="${DISPATCH_ID}"

          echo "Dispatched app build ${DISPATCH_ID}"

          RUN_ID=""
          for _ in $(seq 1 30); do
            sleep 10
            RUN_ID="$(gh api -X GET \
              "repos/${ANDROID_REPO}/actions/workflows/build-apk.yml/runs" \
              -f event=workflow_dispatch -f per_page=50 \
              --jq "first(.workflow_runs[] | select((.display_title // \"\") | contains(\"${DISPATCH_ID}\")) | .id)" || true)"
            if [ -n "$RUN_ID" ]; then
              break
            fi
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Timed out waiting for the app build to start."
            exit 1
          fi
          echo "App build run id ${RUN_ID}"

          DEADLINE=$((SECONDS + 70 * 60))
          while :; do
            STATUS="$(gh api "repos/${ANDROID_REPO}/actions/runs/${RUN_ID}" --jq '.status' || true)"
            if [ "$STATUS" = "completed" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timed out waiting for app build run ${RUN_ID} to finish."
              exit 1
            fi
            sleep 20
          done

          CONCLUSION="$(gh api "repos/${ANDROID_REPO}/actions/runs/${RUN_ID}" --jq '.conclusion')"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::App build run ${RUN_ID} finished with '${CONCLUSION}'; see the Actions tab of the app repository."
            exit 1
          fi

          mkdir -p dist
          gh run download "${RUN_ID}" -R "${ANDROID_REPO}" -n Brokkr-android.apk -D dist
          test -f dist/Brokkr-android.apk
          mv dist/Brokkr-android.apk "dist/Brokkr-${FULL_VERSION}-android.apk"

      - uses: actions/upload-artifact@v7
        if: steps.cfg.outputs.enabled == 'true'
        with:
          name: Brokkr-${{ needs.prepare.outputs.full_version }}-android.apk
          path: dist/Brokkr-${{ needs.prepare.outputs.full_version }}-android.apk
          if-no-files-found: error

  # ═══════════════════════════════════════════════════
  #  Publish GitHub Release  (release only)
  # ═══════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════
  #  README screenshots (committed to assets/screenshots)
  # ═══════════════════════════════════════════════════
  screenshots:
    name: Update README screenshots
    needs: [linux_appimage, windows_installer, macos_app]
    if: >-
      always() &&
      needs.linux_appimage.result == 'success' &&
      needs.windows_installer.result == 'success' &&
      needs.macos_app.result == 'success' &&
      github.event_name != 'pull_request' &&
      inputs.release_type != 'beta' &&
      (github.ref == 'refs/heads/main' || inputs.release_type == 'stable')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          pattern: screenshot-*
          path: assets/screenshots
          merge-multiple: true

      - name: Commit if changed
        run: |
          set -euo pipefail
          git add assets/screenshots
          git diff --cached --quiet && { echo "Screenshots unchanged"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update screenshots [skip ci]"
          git pull --rebase origin main
          git push origin main

  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' && inputs.release_type != 'none'
    needs: [prepare, linux_appimage, linux_appimage_arm64, windows_installer, macos_app, macos_app_x86, android_apk]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Remove debug artifacts from release bundle
        run: |
          set -euo pipefail
          find artifacts -maxdepth 1 -type f -name '*-dbg.*' -delete

      - name: Generate changelog body
        env:
          NEW: ${{ needs.prepare.outputs.tag }}
          PREV: ${{ needs.prepare.outputs.prev_tag }}
        run: |
          set -euo pipefail

          echo "## Brokkr $NEW" > body.md
          echo "" >> body.md

          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/${PREV}" > /dev/null; then
            git log "${PREV}..${NEW}" --pretty=format:"- %s" --no-merges \
              | grep -v '^- Release v' >> body.md || true
            echo "" >> body.md
            echo "" >> body.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${NEW}" >> body.md
          else
            echo "_First release_" >> body.md
          fi

          cat body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Brokkr ${{ needs.prepare.outputs.tag }}
          body_path: body.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: artifacts/*
